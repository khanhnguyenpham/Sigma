name: M3 synthetic integration
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      M3_TEST_DATABASE_URL: postgresql+psycopg://sigma_m3_app:ci-only-app@127.0.0.1:5432/sigma_m3_test
      M3_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/backend/requirements.txt
      - run: python -m pip install -r web/backend/requirements.txt
      - run: python -m pip install --no-deps -e web/backend
      - name: Create isolated CI app role and test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 user=postgres password=ci-only-admin dbname=postgres',autocommit=True) as c:
              c.execute("CREATE ROLE sigma_m3_app LOGIN PASSWORD 'ci-only-app'")
              c.execute('CREATE DATABASE sigma_m3_test OWNER sigma_m3_app')
          PY
      - run: python -m pip check
      - name: Use PostgreSQL tools from the matching service container
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sigma-pg-tools'
          root.mkdir(exist_ok=True)
          for tool in ('pg_dump', 'pg_restore'):
              path = root / tool
              path.write_text('#!/bin/sh\nexec docker exec -i -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE ' + os.environ['POSTGRES_CONTAINER'] + ' ' + tool + ' "$@"\n')
              path.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('M3_PG_BIN=' + str(root) + '\n')
          PY
      - name: Check flat backend entry points
        run: |
          python -m cli --help
          python -m worker --help
      - run: python -B -m pytest web/backend/tests --junitxml=m3-tests.xml
  m2-regression:
    # The immutable 1e-8 synthetic golden was recorded on Windows.
    # Keep strict parity on that platform with the full M3 dependency lock;
    # Linux/PostgreSQL integration remains covered by the backend job above.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/backend/requirements.txt
      - run: python -m pip install -r web/backend/requirements.txt
      - run: python -m pip install --no-deps -e web/backend
      - run: python -m pip check
      - run: python -B -m pytest tests M2/models/tests --junitxml=m2-regression-tests.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated local Compose configuration
        env:
          SIGMA_DB_PASSWORD: ci-synthetic-app-only
          SIGMA_DB_ADMIN_PASSWORD: ci-synthetic-admin-only
          SIGMA_REDIS_PASSWORD: ci-synthetic-redis-only
        run: docker compose -f compose.local.yml config --quiet
      - name: Build source-only application image
        run: docker build -f web/Dockerfile -t sigma-ci:latest .
      - name: Check packaged Python entry points
        run: docker run --rm --entrypoint python sigma-ci:latest -c "import main, worker, cli; from modules.operations import planning, qr; from modules.auth import reset_password; from modules.forecasting import m2_adapter; print('Packaged imports available')"
      - name: Start isolated Compose services and verify application role
        env: &compose-ci-env
          SIGMA_DB_PASSWORD: ci-synthetic-app-only
          SIGMA_DB_ADMIN_PASSWORD: ci-synthetic-admin-only
          SIGMA_REDIS_PASSWORD: ci-synthetic-redis-only
        run: |
          docker tag sigma-ci:latest sigma-local:latest
          docker compose -p sigma-ci -f compose.local.yml up -d database redis
          docker compose -p sigma-ci -f compose.local.yml --profile setup run --rm migrate
          docker compose -p sigma-ci -f compose.local.yml run --rm api python -c "from core.settings import Settings; from core.db import database; from modules.auth.service import create_user; from modules.auth.schemas import UserCreate; from sqlalchemy import text; e,s=database(Settings.from_env().database_url); c=e.connect(); assert not c.scalar(text('SELECT rolsuper FROM pg_roles WHERE rolname=current_user')); c.close(); t=s(); create_user(t,UserCreate(username='ci-admin',display_name='CI synthetic',password='Synthetic-compose-only-2026',role='admin')); t.commit(); t.close(); e.dispose()"
          docker compose -p sigma-ci -f compose.local.yml up -d api
          python - <<'PY'
          import http.cookiejar, json, time, urllib.request
          base='http://127.0.0.1:8000/api/v1'
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          for attempt in range(60):
              try:
                  client.open(base+'/health',timeout=3).close()
                  break
              except Exception:
                  if attempt==59: raise
                  time.sleep(1)
          request=urllib.request.Request(base+'/auth/login',data=json.dumps({'username':'ci-admin','password':'Synthetic-compose-only-2026'}).encode(),headers={'Content-Type':'application/json'})
          with client.open(request) as response:
              assert json.load(response)['user']['role']=='admin'
          with client.open(base+'/operations/queue-status') as response:
              status=json.load(response)
              assert status['driver']=='redis' and status['available'] is True
          with client.open(base+'/operations/summary') as response:
              assert json.load(response)['on_hand_units']==0
          print('Compose login, real Redis and non-superuser DB passed')
          PY
      - name: Stop only the disposable CI Compose project
        if: always()
        env: *compose-ci-env
        run: docker compose -p sigma-ci -f compose.local.yml down --volumes --remove-orphans
